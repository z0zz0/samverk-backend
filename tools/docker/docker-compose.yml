version: '3.8'
services:
    postgresql:
        image: postgres:16.2-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - postgresql_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"       
    pgadmin:
        image: dpage/pgadmin4
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: root
        ports:
            - "5050:80"
    nginx:
        image: nginx:alpine
        volumes:
            - ./tools/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./tools/nginx/localhost.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
            - ./tools/nginx/localhost.key:/etc/ssl/private/nginx-selfsigned.key:ro
        ports:
        - "80:80"
        - "443:443"

volumes:
  postgresql_data:
    driver: local